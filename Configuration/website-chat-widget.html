<!--
  Paste this whole block into WordPress via a "Custom HTML" block on the page footer,
  or a header/footer plugin like "Insert Headers and Footers", so it loads site-wide.

  What it does: a small floating chat bubble, bottom-right. Each visitor gets a random
  session_id stored in their browser (localStorage) so the same visitor keeps talking
  to the same lead record across page reloads. Every message they send is POSTed to
  your n8n "Website Inbound" webhook (see Workflows/01-ai-agent-inbound-intake.json),
  which runs it through the same AI agent as Telegram/WhatsApp/FB/IG.

  Before pasting: replace N8N_WEBHOOK_URL below with your real n8n webhook URL, e.g.
  https://your-n8n-host.com/webhook/wf1-website
-->
<style>
  #rsc-chat-bubble {
    position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px;
    border-radius: 50%; background: #145e76; color: #fff; display: flex;
    align-items: center; justify-content: center; cursor: pointer; z-index: 9999;
    box-shadow: 0 2px 10px rgba(0,0,0,.25); font-size: 24px;
  }
  #rsc-chat-window {
    position: fixed; bottom: 88px; right: 20px; width: 320px; max-width: 90vw;
    height: 420px; background: #fff; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,.25);
    display: none; flex-direction: column; overflow: hidden; z-index: 9999; font-family: sans-serif;
  }
  #rsc-chat-window.open { display: flex; }
  #rsc-chat-header { background: #145e76; color: #fff; padding: 12px 14px; font-weight: 600; }
  #rsc-chat-log { flex: 1; overflow-y: auto; padding: 10px; font-size: 14px; }
  #rsc-chat-log .msg { margin-bottom: 8px; padding: 8px 10px; border-radius: 8px; max-width: 85%; }
  #rsc-chat-log .msg.bot { background: #f0f0f0; }
  #rsc-chat-log .msg.me { background: #145e76; color: #fff; margin-left: auto; }
  #rsc-chat-form { display: flex; border-top: 1px solid #ddd; }
  #rsc-chat-input { flex: 1; border: none; padding: 10px; font-size: 14px; }
  #rsc-chat-form button { border: none; background: #145e76; color: #fff; padding: 0 16px; cursor: pointer; }
</style>

<div id="rsc-chat-bubble">💬</div>
<div id="rsc-chat-window">
  <div id="rsc-chat-header">Chat with us</div>
  <div id="rsc-chat-log"></div>
  <form id="rsc-chat-form">
    <input id="rsc-chat-input" type="text" placeholder="Type a message..." autocomplete="off" required />
    <button type="submit">Send</button>
  </form>
</div>

<script>
(function () {
  var N8N_WEBHOOK_URL = "https://YOUR-N8N-HOST/webhook/wf1-website"; // <-- change this

  var bubble = document.getElementById('rsc-chat-bubble');
  var win = document.getElementById('rsc-chat-window');
  var log = document.getElementById('rsc-chat-log');
  var form = document.getElementById('rsc-chat-form');
  var input = document.getElementById('rsc-chat-input');

  var sessionId = localStorage.getItem('rsc_session_id');
  if (!sessionId) {
    sessionId = 'web_' + Math.random().toString(36).slice(2) + Date.now();
    localStorage.setItem('rsc_session_id', sessionId);
  }

  bubble.addEventListener('click', function () {
    win.classList.toggle('open');
    if (log.children.length === 0) {
      addMessage('bot', "G'day! What can we help with - a roof repair, re-roof, or solar quote?");
    }
  });

  function addMessage(who, text) {
    var el = document.createElement('div');
    el.className = 'msg ' + who;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    addMessage('me', text);
    input.value = '';

    fetch(N8N_WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, text: text, name: '' })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) { addMessage('bot', data.reply || "Thanks - we'll be in touch shortly."); })
      .catch(function () { addMessage('bot', "Sorry, something went wrong sending that - please try again."); });
  });
})();
</script>
