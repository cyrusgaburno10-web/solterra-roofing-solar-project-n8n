# Netlify site config. This project has no build step - it's plain
# HTML/CSS/JS - so the only thing this file needs to declare is the
# publish directory and the edge function that gates admin.html.
# See netlify/edge-functions/admin-auth.js and
# Documentation/deploy-lockdown-guide.md.

[build]
  publish = "."

[[edge_functions]]
  path = "/admin.html"
  function = "admin-auth"

# The homepage file isn't named index.html (kept as
# solterra-landing-au-solarfirst.html for local file:// testing and doc
# references), so rewrite "/" to it - status 200 keeps the URL bar clean.
[[redirects]]
  from = "/"
  to = "/solterra-landing-au-solarfirst.html"
  status = 200
